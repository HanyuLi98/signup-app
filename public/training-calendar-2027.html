return `<section class="month${m===6?' closed':''}" aria-label="${name} 2027"><div class="monthhead"><h2>${name}</h2><span class="quarter">Q${Math.ceil(m/3)}</span></div><div class="weekdays" aria-hidden="true">${c.weekdays.map(x=>'<span>'+x+'</span>').join('')}</div><div class="days">${days}</div><div class="events">${list}${m===12?`<p class="noevents">${c.december}</p>`:''}</div></section>`}).join('');
}
function show(e){selected=e;const c=copy[lang];$('detail-status').textContent=c.status;$('detail-title').textContent=c[e.type];$('detail-date').textContent=range(e)+' · 2027';$('detail-description').textContent=c.details[e.type];$('detail-meta').innerHTML=`<dt>${c.time}</dt><dd>09:30–17:00 · Europe/Berlin</dd><dt>${c.capacity}</dt><dd>${c.seats}</dd><dt>${c.format}</dt><dd>${c.onsite}</dd>`;$('download-event').textContent=e.type==='onboarding'?(lang==='zh'?'下载完整三天课程（.ics）':'Download full three-day course (.ics)'):c.detailDownload;const link=$('register-event');link.hidden=!registrationMode||!isRegistrationOpen(e);const n=data.onboarding.filter(row=>row[0]===e.month).findIndex(row=>row[1]===e.first)+1;const session=e.type==='onboarding'?'S'+n:e.type.toUpperCase();link.href='/?session='+encodeURIComponent('2027-'+pad(e.month)+'-'+session);link.textContent=(lang==='zh'?'报名此课程':'Register for this course');if(!$('detail').open)$('detail').showModal();}
function downloadCalendar(items){const esc=s=>s.replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/;/g,'\\;').replace(/,/g,'\\,');const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z/,'Z');const rows=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Dobot EMEA//2027 Training Calendar//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Dobot EMEA Training 2027'];items.forEach(e=>{const end=dateObj(e.end);end.setUTCDate(end.getUTCDate()+1);rows.push('BEGIN:VEVENT',`UID:${e.id}@training.dobot-emea`,`DTSTAMP:${stamp}`,`DTSTART;VALUE=DATE:${e.start.replace(/-/g,'')}`,`DTEND;VALUE=DATE:${end.toISOString().slice(0,10).replace(/-/g,'')}`,`SUMMARY:${esc(copy[lang][e.type]+' · Dobot EMEA')}`,`DESCRIPTION:${esc(copy[lang].details[e.type]+'\n09:30–17:00 Europe/Berlin. '+copy[lang].notice)}`,'STATUS:TENTATIVE','TRANSP:TRANSPARENT','END:VEVENT')});rows.push('END:VCALENDAR');const enc=new TextEncoder();const fold=line=>{let result='',part='',bytes=0;for(const ch of line){const size=enc.encode(ch).length;if(bytes+size>75){result+=part+'\r\n';part=' ';bytes=1}part+=ch;bytes+=size}return result+part};const blob=new Blob([rows.map(fold).join('\r\n')+'\r\n'],{type:'text/calendar;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=items.length===1?items[0].id+'.ics':'Dobot_EMEA_Training_2027_v1.1.ics';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;render();if($('detail').open&&selected)show(selected)}));
$('filters').addEventListener('click',evt=>{const button=evt.target.closest('[data-filter]');if(!button)return;const type=button.dataset.filter;if(type==='all')active=new Set(categories);else if(active.has(type))active.delete(type);else active.add(type);render()});
$('calendar').addEventListener('click',evt=>{const button=evt.target.closest('[data-event]');if(button)show(events.find(e=>e.id===button.dataset.event))});
$('close-detail').addEventListener('click',()=>$('detail').close());$('detail').addEventListener('click',evt=>{if(evt.target===$('detail')){const rect=$('detail').getBoundingClientRect();if(evt.clientX<rect.left||evt.clientX>rect.right||evt.clientY<rect.top||evt.clientY>rect.bottom)$('detail').close()}});
$('download-event').addEventListener('click',()=>{if(selected)downloadCalendar([selected])});$('download').addEventListener('click',()=>downloadCalendar(events));$('print').addEventListener('click',()=>{location.href='/2027_Training_Calendar_v1.1.pdf'});render();
})();
</script>
